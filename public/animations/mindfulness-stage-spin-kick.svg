<style>.spin-arm-left { transform-box: view-box; transform-origin: 78px 109px; }
.spin-forearm-left { transform-box: view-box; transform-origin: 55px 170px; }
.spin-arm-right { transform-box: view-box; transform-origin: 162px 109px; }
.spin-forearm-right { transform-box: view-box; transform-origin: 185px 170px; }
.spin-leg-left { transform-box: view-box; transform-origin: 102px 239px; }
.spin-calf-left { transform-box: view-box; transform-origin: 84px 330px; }
.spin-leg-right { transform-box: view-box; transform-origin: 138px 239px; }
.spin-calf-right { transform-box: view-box; transform-origin: 156px 330px; }
.spin-head { transform-box: view-box; transform-origin: 120px 91px; }
.spin-turn { transform-box: view-box; transform-origin: 120px 240px; animation: spin-turn 4400ms linear infinite; }
.spin-front { animation: spin-front 4400ms steps(1,end) infinite; }
.spin-back { opacity: 0; animation: spin-back 4400ms steps(1,end) infinite; }
@keyframes spin-turn { 0% { transform: scaleX(1); } 10% { transform: scaleX(.06); } 20% { transform: scaleX(1); } 30% { transform: scaleX(.06); } 40%,100% { transform: scaleX(1); } }
@keyframes spin-front { 0%,9.99% { opacity: 1; } 10%,29.99% { opacity: 0; } 30%,100% { opacity: 1; } }
@keyframes spin-back { 0%,9.99% { opacity: 0; } 10%,29.99% { opacity: 1; } 30%,100% { opacity: 0; } }
.spin-arm-left { animation: spin-arm-left 4400ms ease-in-out infinite; }
.spin-arm-right { animation: spin-arm-right 4400ms ease-in-out infinite; }
.spin-forearm-left { animation: spin-forearm-left 4400ms ease-in-out infinite; }
.spin-forearm-right { animation: spin-forearm-right 4400ms ease-in-out infinite; }
.spin-leg-right { animation: spin-kick-thigh 4400ms ease-in-out infinite; }
.spin-calf-right { animation: spin-kick-calf 4400ms ease-in-out infinite; }
.spin-head { animation: spin-head 4400ms ease-in-out infinite; }
@keyframes spin-arm-left { 0% { transform: rotate(0deg); } 9% { transform: rotate(-35deg); } 34% { transform: rotate(-35deg); } 44% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@keyframes spin-arm-right { 0% { transform: rotate(0deg); } 9% { transform: rotate(35deg); } 34% { transform: rotate(35deg); } 44% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@keyframes spin-forearm-left { 0% { transform: rotate(0deg); } 9% { transform: rotate(-110deg); } 34% { transform: rotate(-110deg); } 44% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@keyframes spin-forearm-right { 0% { transform: rotate(0deg); } 9% { transform: rotate(110deg); } 34% { transform: rotate(110deg); } 44% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@keyframes spin-kick-thigh { 0%,45% { transform: rotate(0deg) scale(1,1); } 55% { transform: rotate(28deg) scale(1,1); } 68%,74% { transform: rotate(-55deg) scale(.85,.37); } 86%,100% { transform: rotate(0deg) scale(1,1); } }@keyframes spin-kick-calf { 0% { transform: rotate(0deg); } 45% { transform: rotate(0deg); } 55% { transform: rotate(-118deg); } 68% { transform: rotate(0deg); } 74% { transform: rotate(0deg); } 86% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@keyframes spin-head { 0% { transform: rotate(0deg); } 45% { transform: rotate(0deg); } 62% { transform: rotate(-6deg); } 82% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }@media (prefers-reduced-motion: reduce) { .spin-turn, .spin-front, .spin-back, .spin-arm-left, .spin-arm-right, .spin-forearm-left, .spin-forearm-right, .spin-leg-right, .spin-calf-right, .spin-head { animation: none; } .spin-leg-right { transform: rotate(-55deg) scale(.85,.37); } .spin-calf-right { transform: rotate(0deg); } }</style>
