<script type="module">
// =====================================================================
// Ver.3 メガシティ・バトル（Three.js）
// 夕暮れの架空の大都市。川から現れた大怪獣と、空から降りてきた巨大ロボットが、街を壊しながら戦う。
// 1 回り約 48 秒。最後に暗転して、街を元に戻してくり返す。
// URL に ?t=秒 をつけると、その時刻まで進めて止めた絵を出す（確認用）
// =====================================================================
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const params = new URLSearchParams(location.search);
addEventListener("error", (e) => { window.__err = (window.__err || "") + e.message; });
const STILL = params.has("t") ? parseFloat(params.get("t")) : null;

// ---------- 道具 ----------
let seed = 20261114;
function rand() {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = (k) => k * k * (3 - 2 * k);
const easeOut = (k) => 1 - (1 - k) ** 3;
const easeIn = (k) => k * k * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => a.clone().lerp(b, k);
function kf(t, keys, ease = smooth) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i];
    const [t1, b] = keys[i + 1];
    if (t <= t1) return lerp(a, b, ease((t - t0) / (t1 - t0)));
  }
  return keys.at(-1)[1];
}

// ---------- 描画の準備 ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: STILL !== null });
} catch (e) {
  document.getElementById("err").style.display = "flex";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 7000);

// ---------- 空（夕暮れ） ----------
const SUN_DIR = V(-0.42, 0.17, 0.89).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uSun: { value: SUN_DIR },
    uTop: { value: new THREE.Color("#141a3d") },
    uMid: { value: new THREE.Color("#7a4a72") },
    uHor: { value: new THREE.Color("#ff9455") },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uSun, uTop, uMid, uHor; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 c = mix(uHor, uMid, smoothstep(0.0, 0.2, h));
      c = mix(c, uTop, smoothstep(0.18, 0.65, h));
      if (h < 0.0) c = mix(uHor * 0.55, vec3(0.04, 0.04, 0.07), smoothstep(0.0, -0.25, h));
      float s = max(dot(d, normalize(uSun)), 0.0);
      c += vec3(1.0, 0.55, 0.25) * pow(s, 6.0) * 0.55 + vec3(1.0, 0.85, 0.6) * pow(s, 900.0) * 12.0;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat);
scene.add(sky);
{
  // 金属の映り込み用の環境（空をそのまま使う）
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
}
scene.fog = new THREE.FogExp2(new THREE.Color("#8f5d60"), 0.00105);

const hemi = new THREE.HemisphereLight(0xffc29a, 0x1c1c2a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb27a, 3.0);
sun.position.copy(SUN_DIR).multiplyScalar(900).add(V(20, 0, 60));
sun.target.position.set(20, 0, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 50, far: 2200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.8;
scene.add(sun, sun.target);

// ---------- 地面・道路・川 ----------
const PITCH = 46, BLOCK = 34;
const X0 = -334, Z0 = -334, XMAX = 334, ZMAX = 252;
const RIVER0 = 262, RIVER1 = 410;
function roadTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#28282d"; g.fillRect(0, 0, 256, 256);
  const b = (256 * BLOCK) / PITCH, o = (256 - b) / 2;
  g.fillStyle = "#57534f"; g.fillRect(o, o, b, b);
  g.fillStyle = "#3b3a3c"; g.fillRect(o + 7, o + 7, b - 14, b - 14);
  g.strokeStyle = "#c8b36a"; g.lineWidth = 2; g.setLineDash([9, 9]);
  g.beginPath(); g.moveTo(1, 0); g.lineTo(1, 256); g.moveTo(0, 1); g.lineTo(256, 1); g.stroke();
  g.setLineDash([]); g.strokeStyle = "#e8e8e8"; g.lineWidth = 3;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(o - 14 + i * 0, o + 6 + i * 6); g.lineTo(o - 4, o + 6 + i * 6); g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
{
  const W = 2400, H = 1800, px = 0, pz = RIVER0 - H / 2;
  const tex = roadTexture();
  tex.repeat.set(W / PITCH, H / PITCH);
  const cx0 = X0 + BLOCK / 2, cz0 = Z0 + BLOCK / 2;
  tex.offset.set(0.5 - (cx0 - px + W / 2) / PITCH, 0.5 - (pz - cz0 + H / 2) / PITCH);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0.05 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(px, 0, pz);
  ground.receiveShadow = true;
  scene.add(ground);
  const far = new THREE.Mesh(new THREE.PlaneGeometry(W, 1600), new THREE.MeshStandardMaterial({ color: "#2b2a2e", roughness: 0.95 }));
  far.rotation.x = -Math.PI / 2;
  far.position.set(0, 0, RIVER1 + 800);
  far.receiveShadow = true;
  scene.add(far);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(W, RIVER1 - RIVER0 + 20), new THREE.MeshStandardMaterial({ color: "#1b2735", roughness: 0.12, metalness: 0.9, envMapIntensity: 1.2 }));
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -2, (RIVER0 + RIVER1) / 2);
  scene.add(water);
  const wallMat = new THREE.MeshStandardMaterial({ color: "#6d6862", roughness: 0.9 });
  for (const z of [RIVER0, RIVER1]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(W, 10, 3), wallMat);
    w.position.set(0, -5, z);
    scene.add(w);
  }
}

// ---------- ビルの外壁（窓） ----------
const STYLES = [
  { wall: "#3d5068", glass: "#2a3d55", lit: 0.12, metal: 0.65, rough: 0.25, cols: 5, rows: 9, gap: 1 },
  { wall: "#9a9184", glass: "#3a3f48", lit: 0.14, metal: 0.1, rough: 0.85, cols: 4, rows: 8, gap: 4 },
  { wall: "#8a5644", glass: "#33363d", lit: 0.16, metal: 0.05, rough: 0.9, cols: 4, rows: 8, gap: 4 },
  { wall: "#4a4b53", glass: "#262a31", lit: 0.12, metal: 0.4, rough: 0.5, cols: 6, rows: 10, gap: 2 },
  { wall: "#b3afa5", glass: "#3c4552", lit: 0.13, metal: 0.15, rough: 0.7, cols: 5, rows: 9, gap: 3 },
];
for (const s of STYLES) {
  const W = 64, H = 128;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const e = document.createElement("canvas"); e.width = W; e.height = H;
  const g = c.getContext("2d"), ge = e.getContext("2d");
  g.fillStyle = s.wall; g.fillRect(0, 0, W, H);
  ge.fillStyle = "#000"; ge.fillRect(0, 0, W, H);
  const cw = W / s.cols, ch = H / s.rows;
  for (let r = 0; r < s.rows; r++) for (let q = 0; q < s.cols; q++) {
    const x = q * cw + s.gap / 2, y = r * ch + s.gap / 2 + 1, w = cw - s.gap, h = ch - s.gap - 2;
    const lit = rand() < s.lit;
    g.fillStyle = lit ? "#ffd9a0" : s.glass; g.fillRect(x, y, w, h);
    if (!lit && rand() < 0.5) { g.fillStyle = "rgba(255,190,140,0.18)"; g.fillRect(x, y, w, h * 0.4); }
    if (lit) { ge.fillStyle = rand() < 0.2 ? "#bfe0ff" : "#ffc77a"; ge.fillRect(x, y, w, h); }
  }
  s.map = new THREE.CanvasTexture(c); s.map.colorSpace = THREE.SRGBColorSpace;
  s.emi = new THREE.CanvasTexture(e); s.emi.colorSpace = THREE.SRGBColorSpace;
  for (const t of [s.map, s.emi]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; }
  s.avg = new THREE.Color(s.wall).lerp(new THREE.Color(s.glass), 0.45);
}
function facadeMaterial(s, w, h) {
  const rx = Math.max(1, Math.round(w / 6)), ry = Math.max(1, Math.round(h / 9));
  const ox = Math.floor(rand() * 7) / 7, oy = Math.floor(rand() * 5) / 5;
  const map = s.map.clone(), emi = s.emi.clone();
  for (const t of [map, emi]) { t.needsUpdate = true; t.repeat.set(rx, ry); t.offset.set(ox, oy); }
  return new THREE.MeshStandardMaterial({ map, emissiveMap: emi, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: s.rough, metalness: s.metal });
}

// ---------- 壊れるもの ----------
const destructibles = [];
function addBox(group, x, y, z, w, h, d, mat, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  group.add(m);
  return m;
}
function addDestructible(meshes, parts, color, kind = "building") {
  const minX = Math.min(...parts.map((p) => p.x - p.w / 2)), maxX = Math.max(...parts.map((p) => p.x + p.w / 2));
  const minZ = Math.min(...parts.map((p) => p.z - p.d / 2)), maxZ = Math.max(...parts.map((p) => p.z + p.d / 2));
  const top = Math.max(...parts.map((p) => p.y + p.h / 2));
  destructibles.push({ meshes, parts, color, kind, minX, maxX, minZ, maxZ, top, alive: true, x: (minX + maxX) / 2, z: (minZ + maxZ) / 2 });
}

// 自由の塔（架空のデザイン）と、怪獣と戦う場所
const DIR = V(35, 0, 45).normalize(); // ロボット → 怪獣の向き
const R0 = V(-40, 0, -30), R1 = V(5, 0, 75), K0 = V(70, 0, 334), K2 = V(40, 0, 120);
const TOWER = K2.clone().addScaledVector(DIR, 75);
const KC = K2.clone().addScaledVector(DIR, 40); // 殴られた怪獣が飛んでいく先
const PERP = V(DIR.z, 0, -DIR.x);

const city = new THREE.Group();
scene.add(city);
for (let bx = X0; bx + BLOCK <= XMAX; bx += PITCH) {
  for (let bz = Z0; bz + BLOCK <= ZMAX; bz += PITCH) {
    const cut = rand();
    const cells = cut < 0.3 ? [[0, 0, 1, 1]] : cut < 0.65 ? (rand() < 0.5 ? [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]] : [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]]) : [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]];
    for (const [u, v, su, sv] of cells) {
      const m = 3.2;
      const w = BLOCK * su - m * 2, d = BLOCK * sv - m * 2;
      const x = bx + BLOCK * (u + su / 2), z = bz + BLOCK * (v + sv / 2);
      if (Math.hypot(x - TOWER.x, z - TOWER.z) < 40) continue;
      // 高層ビル街は南西に置き、戦う場所（中央〜川沿い）は中低層にする
      // （ロボット約 75・怪獣約 80 が、まわりのビルより大きく見えるように）
      const dc = Math.hypot(x + 190, z + 200);
      const db = Math.hypot(x - 30, z - 110);
      let h = 12 + rr(0, 22) + 120 * Math.exp(-(dc * dc) / (2 * 140 * 140)) * rr(0.5, 1.3);
      if (db < 170) h = Math.min(h, 18 + rr(0, 30));
      else if (rand() < 0.06) h *= 1.6;
      h = Math.min(h, 160);
      const s = STYLES[Math.floor(rand() * STYLES.length)];
      const mat = facadeMaterial(s, w, h);
      mat.color.setHSL(rr(0, 1), rr(0, 0.08), rr(0.82, 1));
      const meshes = [addBox(city, x, h / 2, z, w, h, d, mat)];
      const parts = [{ x, y: h / 2, z, w, h, d }];
      if (h > 70 && rand() < 0.75) {
        const th = h * rr(0.12, 0.22), tw = w * rr(0.5, 0.75), td = d * rr(0.5, 0.75);
        meshes.push(addBox(city, x, h + th / 2, z, tw, th, td, facadeMaterial(s, tw, th)));
        parts.push({ x, y: h + th / 2, z, w: tw, h: th, d: td });
        if (rand() < 0.5) meshes.push(addBox(city, x, h + th + 9, z, 0.8, 18, 0.8, new THREE.MeshStandardMaterial({ color: "#555", metalness: 0.8, roughness: 0.4 })));
      } else if (rand() < 0.4) {
        meshes.push(addBox(city, x + rr(-w / 4, w / 4), h + 3, z + rr(-d / 4, d / 4), w * 0.3, 6, d * 0.3, new THREE.MeshStandardMaterial({ color: "#5b5852", roughness: 0.9 })));
      }
      addDestructible(meshes, parts, s.avg.clone());
    }
  }
}
// 川の向こう岸の街（遠景。壊れない）
for (let i = 0; i < 260; i++) {
  const x = rr(-1200, 1200), z = rr(RIVER1 + 30, 1300), w = rr(16, 40), d = rr(16, 40);
  const h = rr(15, 60) + (Math.abs(x) < 400 ? rr(0, 90) : 0);
  const s = STYLES[Math.floor(rand() * STYLES.length)];
  const m = addBox(scene, x, h / 2, z, w, h, d, facadeMaterial(s, w, h), false);
  m.receiveShadow = false;
}

// 吊り橋（川をまたぐ）
const bridge = new THREE.Group();
scene.add(bridge);
const bridgeMat = new THREE.MeshStandardMaterial({ color: "#b5452e", metalness: 0.55, roughness: 0.45 });
const deckMat = new THREE.MeshStandardMaterial({ color: "#3b3b40", metalness: 0.3, roughness: 0.7 });
const BX = 70;
for (const [z0, z1] of [[256, 300], [300, 362], [362, 418]]) {
  const zc = (z0 + z1) / 2, len = z1 - z0;
  const m = addBox(bridge, BX, 20, zc, 18, 4, len, deckMat);
  addDestructible([m], [{ x: BX, y: 20, z: zc, w: 18, h: 4, d: len }], new THREE.Color("#3b3b40"), "deck");
}
for (const z of [292, 372]) {
  const g1 = addBox(bridge, BX - 9, 40, z, 4, 80, 6, bridgeMat);
  const g2 = addBox(bridge, BX + 9, 40, z, 4, 80, 6, bridgeMat);
  const g3 = addBox(bridge, BX, 74, z, 22, 4, 6, bridgeMat);
  addDestructible([g1, g2, g3], [{ x: BX - 9, y: 40, z, w: 4, h: 80, d: 6 }, { x: BX + 9, y: 40, z, w: 4, h: 80, d: 6 }, { x: BX, y: 74, z, w: 22, h: 4, d: 6 }], new THREE.Color("#b5452e"), "bridge");
}
{
  const pts = [];
  for (const sx of [-9, 9]) {
    const curve = [];
    for (let i = 0; i <= 40; i++) {
      const z = 230 + (i / 40) * 210;
      let y;
      if (z < 292) y = lerp(22, 78, (z - 230) / 62);
      else if (z < 372) { const k = (z - 292) / 80; y = 78 - 52 * Math.sin(Math.PI * k); }
      else y = lerp(78, 22, (z - 372) / 68);
      curve.push(V(BX + sx, y, z));
    }
    for (let i = 0; i < curve.length - 1; i++) pts.push(curve[i], curve[i + 1]);
    for (let i = 2; i < curve.length - 2; i += 2) pts.push(curve[i], V(curve[i].x, 22, curve[i].z));
  }
  const cables = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: "#d9a07a" }));
  bridge.add(cables);

  [27.3, () => { impact("ズドドドォン!!"); boom(V(TOWER.x, 60, TOWER.z), 2); smash(KC.x, KC.z, 28, 1.3, 20); for (let i = 0; i < 70; i++) addChunk(TOWER.x + rr(-12, 12), rr(40, 140), TOWER.z + rr(-12, 12), rr(2, 6), rr(2, 6), rr(2, 6), DIR.x * rr(10, 50) + rr(-10, 10), rr(0, 20), DIR.z * rr(10, 50) + rr(-10, 10), new THREE.Color("#7f95ad"), tl); shake(2.5); }],
  [29.25, () => { const tip = TOWER.clone().addScaledVector(DIR, 110); boom(V(tip.x, 10, tip.z), 2.2); for (let d = 20; d < 190; d += 20) { const q = TOWER.clone().addScaledVector(DIR, d); smash(q.x, q.z, 22, 1.4, 8); } towerTop.visible = false; for (let i = 0; i < 260; i++) { const d = rr(0, 175); const q = TOWER.clone().addScaledVector(DIR, d); addChunk(q.x + rr(-8, 8), rr(2, 14), q.z + rr(-8, 8), rr(2, 8), rr(2, 6), rr(2, 8), rr(-20, 20), rr(10, 40), rr(-20, 20), new THREE.Color("#8fa4bb"), tl); } shockRing(TOWER.clone().addScaledVector(DIR, 100), 200, 1.2); shake(3); }],
  [30.6, () => { const p = RP.clone().addScaledVector(DIR, 5); p.y = 40; boom(p, 1.3); impact("ドガァッ!!"); screenFlash(0.7); slowmo(0.08, 0.35, 0.5); shake(2.5); }],
  [33.3, () => { shockRing(RT, 140, 0.9, 0xbfe9ff); for (let i = 0; i < 60; i++) { const a = rr(0, 6.28); smoke.emit(RT.x, 3, RT.z, Math.cos(a) * rr(30, 70), rr(0, 6), Math.sin(a) * rr(30, 70), rr(2, 4), 14, 60, COL.dust, 0.7, 0.8, 0); } }],
  [36.3, () => { impact("ズバァァァッ!!", "fight"); boom(V(KC.x, 45, KC.z), 2.4); screenFlash(0.8); slowmo(0.08, 0.4, 0.5); smash(KC.x, KC.z, 34, 1.2, 30); }],
  [39.6, () => { impact("K.O.!!", "ko"); screenFlash(1); slowmo(0.22, 0.22, 1.4); shockRing(RS, 420, 1.6); shockRing(RS, 240, 1.0, 0x9fe6ff); boom(V(RS.x, 10, RS.z), 3.2); smash(RS.x, RS.z, 70, 1.8, 10); shake(4); }],
  [40.8, () => { const p = KC.clone().addScaledVector(DIR, 40); boom(V(p.x, 5, p.z), 1.8); smash(p.x, p.z, 45, 1.3, 6); shake(2.5); }],
];
let evI = 0;

// ---------- カメラ ----------
const _look = new THREE.Vector3();
function shot(t, RS_, KS) {
  const R = RS_.pos, K = KS.pos;
  if (t < 4.6) { const k = seg(t, 0, 4.6); return [V(-430 + 150 * k, 240 - 60 * k, -260 + 90 * k), V(70, 30, 330), 44]; }
  if (t < 7.1) return [V(8, 9, 272), V(70, 22 + Math.max(0, K.y + 60) * 0.5, 335), 42];
  if (t < 9.2) { const k = seg(t, 7.1, 9.2); return [V(K.x - 48 - 8 * k, 14, K.z - 62 + 10 * k), V(K.x, 66, K.z), 40]; }
  if (t < 13.6) { const a = KS.ry + 1.0; return [V(K.x + Math.sin(a) * 175, 150, K.z + Math.cos(a) * 175), V(K.x, 34, K.z), 44]; }
  if (t < 16.6) return [R0.clone().addScaledVector(DIR, 150).addScaledVector(PERP, 60).add(V(0, 60, 0)), V(R.x, Math.min(R.y + 40, 520), R.z), 56];
  if (t < 18.7) { const k = seg(t, 16.6, 18.7); return [R.clone().addScaledVector(DIR, 105 - 25 * k).addScaledVector(PERP, 35).add(V(0, 52 - 14 * k, 0)), V(R.x, 34, R.z), 42]; }
  if (t < 21) { const m = lerpV(R, K, 0.5); return [m.clone().addScaledVector(PERP, -250).add(V(0, 165, 0)), m.add(V(0, 30, 0)), 46]; }
  if (t < 24) { const dk = R.clone().sub(K).normalize(); return [K.clone().addScaledVector(dk, -72).addScaledVector(PERP, 34).add(V(0, 92, 0)), V(R.x, 40, R.z), 44]; }
  if (t < 26) return [R.clone().addScaledVector(DIR, -50).addScaledVector(PERP, 16).add(V(0, 30, 0)), V(K.x, 48, K.z), 50];
  if (t < 29.7) { const m = lerpV(K2, TOWER, 0.55); return [m.clone().addScaledVector(PERP, -230).add(V(0, 120, 0)), V(m.x, lerp(45, 100, seg(t, 26.6, 28)), m.z), 50]; }
  if (t < 33.3) { const m = lerpV(KC, RT, 0.5); return [m.clone().addScaledVector(PERP, 200).add(V(0, 130, 0)), m.add(V(0, 25, 0)), 50]; }
  if (t < 36) return [RT.clone().addScaledVector(PERP, 45).addScaledVector(DIR, -40).add(V(0, 7, 0)), V(R.x, R.y + 34, R.z), 56];
  if (t < 38) return [R.clone().addScaledVector(DIR, -70).addScaledVector(PERP, 120).add(V(0, -25, 0)), V(lerp(R.x, K.x, 0.45), lerp(R.y, 40, 0.5), lerp(R.z, K.z, 0.45)), 55];
  if (t < 41.6) return [KC.clone().addScaledVector(PERP, -200).add(V(0, 95, 0)), V(KC.x, 35, KC.z), 47];
  const a = (t - 41.6) * 0.32 + 2.2;
  return [V(R.x + Math.cos(a) * 125, 62, R.z + Math.sin(a) * 125), V(R.x, 42, R.z), 46];
}

// ---------- 1 周の更新 ----------
let tl = 0;
const T_END = 48;
const _a = new THREE.Vector3(), _b = new THREE.Vector3();
let lastBeamBoom = 0;
function resetWorld() {
  for (const o of destructibles) { o.alive = true; for (const m of o.meshes) m.visible = true; }
  D.used = 0; D.next = 0; debris.count = 0;
  smoke.clear(); fire.clear();
  fires.length = 0;
  towerTop.visible = true;
  stats.count = 0; stats.damage = 0;
  evI = 0;
}
function update(dtReal) {
  realT += dtReal;
  const dt = dtReal * timeScale();
  tl += dt;
  if (tl >= T_END) { tl = 0; resetWorld(); }
  while (evI < EVENTS.length && EVENTS[evI][0] <= tl) EVENTS[evI++][1]();

  const RSx = robotState(tl), KSx = kaijuState(tl);
  applyRobot(RSx);
  applyKaiju(KSx);
  scene.updateMatrixWorld();

  // 歩いた所・飛ばされた所のビルを壊す
  if (tl > 9.2 && tl < 19.4) smash(KSx.pos.x, KSx.pos.z, 19, 0.9, 30);
  if (tl > 18.4 && tl < 21) smash(RSx.pos.x, RSx.pos.z, 13, 0.9, 25);
  if (tl > 24.2 && tl < 26) smash(RSx.pos.x, RSx.pos.z, 13, 1.1, 25);
  if (tl > 30.6 && tl < 32) smash(RSx.pos.x, RSx.pos.z, 18, 1.3, 15);
  if (tl > 39.6 && tl < 40.9) { const p = KC.clone().addScaledVector(DIR, 40 * seg(tl, 39.6, 40.8)); smash(p.x, p.z, 26, 1.2, 10); }
  // 川の中を歩くときの水しぶき
  if (tl > 4.6 && tl < 13 && KSx.pos.z > RIVER0 && rand() < 0.9) {
    for (let i = 0; i < 2; i++) smoke.emit(KSx.pos.x + rr(-24, 24), 0, KSx.pos.z + rr(-24, 24), rr(-8, 8), rr(15, 40), rr(-8, 8), rr(0.8, 1.6), 6, 20, COL.water, 0.5, 0.5, -35);
  }
  // ビーム
  beamK.visible = beamD.visible = beamR.visible = false;
  if (tl > 21 && tl < 24) {
    KAIJU.mouth.getWorldPosition(_a);
    ROBOT.core.getWorldPosition(_b);
    _b.addScaledVector(DIR, 6);
    setBeam(beamK, _a, _b, smooth(seg(tl, 21, 21.2)));
    for (let i = 0; i < 6; i++) fire.emit(_b.x, _b.y, _b.z, rr(-60, 60), rr(-20, 60), rr(-60, 60), rr(0.2, 0.5), 3, 1, rand() < 0.5 ? COL.purple : COL.spark, 1, 1, -40);
    if (tl > 22.2) {
      const k = seg(tl, 22.2, 24);
      const end = lerpV(V(-170, 0, 120), V(-60, 0, -190), k);
      end.y = 18;
      setBeam(beamD, _b, end);
      smash(end.x, end.z, 15, 1.1, 18);
      if (tl - lastBeamBoom > 0.14) { lastBeamBoom = tl; boom(end, 0.8); }
    }
  }
  if (tl > 36 && tl < 38) {
    ROBOT.core.getWorldPosition(_a);
    _b.set(KC.x, 42, KC.z);
    setBeam(beamR, _a, _b, smooth(seg(tl, 36, 36.25)));
    for (let i = 0; i < 6; i++) fire.emit(_b.x, _b.y, _b.z, rr(-70, 70), rr(-20, 70), rr(-70, 70), rr(0.2, 0.6), 4, 1, rand() < 0.5 ? COL.cyan : COL.spark, 1, 1, -40);
  }
  // 自由の塔の上半分が倒れる
  if (tl >= 27.3 && towerTop.visible) {
    const k = seg(tl, 27.3, 29.25);
    const axis = V(0, 1, 0).cross(DIR).normalize();
    towerTop.quaternion.setFromAxisAngle(axis, 1.55 * easeIn(k));
    towerTop.position.set(TOWER.x + DIR.x * 30 * k, TB - 140 * easeIn(k), TOWER.z + DIR.z * 30 * k);
    if (rand() < 0.6) smoke.emit(TOWER.x + rr(-8, 8), TB - 140 * easeIn(k) + rr(-5, 5), TOWER.z + rr(-8, 8), rr(-6, 6), rr(0, 6), rr(-6, 6), rr(3, 5), 14, 50, COL.dust, 0.6);
  } else if (tl < 27.3) {
    towerTop.quaternion.identity();
    towerTop.position.set(TOWER.x, TB, TOWER.z);
  }
  towerTop.userData.beacon.material.emissiveIntensity = Math.sin(realT * 4) > 0 ? 9 : 0.3;
  // 燃え続ける場所
  for (const f of fires) {
    if (tl > f.until) continue;
    if (rand() < 0.35) fire.emit(f.x + rr(-f.w, f.w), rr(1, 6), f.z + rr(-f.d, f.d), rr(-2, 2), rr(8, 20), rr(-2, 2), rr(0.6, 1.3), rr(6, 10), rr(12, 20), rand() < 0.3 ? COL.hot : COL.fire, 0.9, 0.5, 4);
    if (rand() < 0.15) smoke.emit(f.x + rr(-f.w, f.w), rr(10, 22), f.z + rr(-f.d, f.d), rr(-3, 3) + 4, rr(8, 16), rr(-3, 3), rr(5, 9), rr(10, 16), rr(40, 70), COL.dark, 0.32, 0.2, 1);
  }
  updateDebris(dt, tl);
  smoke.update(dt);
  fire.update(dt);
  for (const f of flashes) { f.v *= Math.exp(-dtReal * 6); f.l.intensity = f.v; }
  for (const r of rings) {
    if (r.t > r.life) { r.m.material.opacity = 0; continue; }
    r.t += dt;
    const k = r.t / r.life;
    const s = r.R * easeOut(k);
    r.m.scale.set(s, s, s);
    r.m.material.opacity = (1 - k) * 0.9;
  }

  // カメラ
  const [p, l, fov] = shot(tl, RSx, KSx);
  shakeV *= Math.exp(-dtReal * 3.2);
  const sh = shakeV * 2.2;
  camera.position.set(p.x + rr(-sh, sh), p.y + rr(-sh, sh), p.z + rr(-sh, sh));
  _look.set(l.x + rr(-sh, sh) * 0.6, l.y + rr(-sh, sh) * 0.6, l.z);
  camera.lookAt(_look);
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); setParticleScale(); }
  sky.position.copy(camera.position);

  // 画面の上の文字
  flashV *= Math.exp(-dtReal * 7);
  flashEl.style.opacity = flashV.toFixed(3);
  document.getElementById("fade").style.opacity = Math.max(1 - seg(tl, 0, 1.2), seg(tl, 46.4, 47.8)).toFixed(3);
  document.getElementById("cnt").textContent = stats.count;
  document.getElementById("dmg").textContent = "$" + stats.damage.toFixed(1) + "B";
  const mins = 42 + Math.floor(tl / 20);
  document.getElementById("clock").textContent = "18:" + String(mins).padStart(2, "0");
}

// ---------- 画面の大きさ・ブルーム ----------
// 光のにじみ用の作業画像。半精度の浮動小数が使えない環境でも描けるように、種類を選べるようにする
const rtType = params.get("rt") === "u8" ? THREE.UnsignedByteType : THREE.HalfFloatType;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: rtType }));
composer.addPass(new RenderPass(scene, camera));
// 計算の途中で不正な値（NaN）が出ても、光のにじみ（ブルーム）で画面全体が黒くならないようにする
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      if (!(c.r == c.r) || !(c.g == c.g) || !(c.b == c.b) || c.r > 1e4 || c.g > 1e4 || c.b > 1e4) c = vec4(0.0, 0.0, 0.0, 1.0);
      gl_FragColor = vec4(min(c.rgb, vec3(40.0)), 1.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function setParticleScale() {
  const s = renderer.domElement.height / (2 * Math.tan((camera.fov * Math.PI) / 360));
  smoke.mat.uniforms.uScale.value = s;
  fire.mat.uniforms.uScale.value = s;
}
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  setParticleScale();
}
addEventListener("resize", resize);
resize();

if (STILL !== null) {
  // 確認用：決まった刻みで指定の時刻まで進めて、1 枚だけ描く
  while (tl < STILL) update(1 / 30);
  // 画面に出るまで、同じ絵を何回か描く
  let n = 0;
  renderer.setAnimationLoop(() => {
    if (params.has("nobloom")) renderer.render(scene, camera); else composer.render();
    if (++n > 3) {
      renderer.setAnimationLoop(null);
      const gl = renderer.getContext(), px = new Uint8Array(4);
      gl.readPixels(Math.floor(gl.drawingBufferWidth / 2), Math.floor(gl.drawingBufferHeight / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      document.title = "ready " + Array.from(px).join(",") + " " + (window.__err || "");
      // 確認用の撮影で WebGL の画面が写らないことがあるので、画像にして重ねる
      const img = new Image();
      img.src = renderer.domElement.toDataURL("image/png");
      img.style.cssText = "position:fixed;inset:0;width:100%;height:100%;z-index:3";
      document.body.appendChild(img);
    }
  });
} else {
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    update(Math.min(clock.getDelta(), 1 / 20));
    composer.render();
  });
}
</script>
