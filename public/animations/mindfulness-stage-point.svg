<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 440" width="240" height="440">
  <defs>
    <linearGradient id="jacket" x1="0" x2="1"><stop stop-color="#10151f"/><stop offset=".48" stop-color="#242c3a"/><stop offset="1" stop-color="#090e17"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#a97527"/><stop offset=".28" stop-color="#ffe4a1"/><stop offset=".53" stop-color="#c28c35"/><stop offset=".75" stop-color="#f6d17e"/><stop offset="1" stop-color="#9b6420"/></linearGradient>
    <linearGradient id="skin" x1="0" x2="1"><stop stop-color="#d3a68d"/><stop offset=".5" stop-color="#f0c9ae"/><stop offset="1" stop-color="#b9836c"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c3741"/><stop offset="1" stop-color="#060e15"/></linearGradient>
    <pattern id="bandolier" width="8" height="18" patternUnits="userSpaceOnUse"><rect width="8" height="18" fill="url(#gold)"/><path d="M1 1H7V15H1ZM3 2V14" fill="none" stroke="#fff0bb" stroke-width=".7"/><path d="M0 17H8" stroke="#755020"/></pattern>
  </defs>
  <style>
    .point-arm { transform-box: view-box; transform-origin: 165px 108px; animation: point-hit 650ms ease-out both; }
    @keyframes point-hit { 0% { transform: rotate(-7deg); } 65% { transform: rotate(3deg); } 100% { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) { .point-arm { animation: none; } }
  </style>
  <!-- 足を開き、腕を下げて静止する舞台衣装。帽子やダンスの決めポーズは使わない。 -->
  <g stroke-linecap="round" stroke-linejoin="round">
