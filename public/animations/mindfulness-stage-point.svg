    <path d="M38 221L52 226L51 238L44 244L32 239L30 231Z" fill="url(#skin)" stroke="#7d584b"/>

    <path d="M35 231L45 234M37 237L45 239" stroke="#9f705b"/>
    <!-- 軍服、白い襟元、交差した金の装飾、三段のベルト。 -->
