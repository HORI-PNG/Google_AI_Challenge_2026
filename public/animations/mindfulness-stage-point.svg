    <path d="M44 398L69 402L65 417L40 416ZM171 402L196 398L200 416L176 417Z" fill="#f0f0e8" stroke="#cbd0d1"/>
    <path d="M40 411L65 413L67 423Q59 431 35 431L20 430Q17 423 27 419Z" fill="#0a0e14" stroke="#75818d" stroke-width="1.4"/>
